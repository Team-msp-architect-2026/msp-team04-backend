apiVersion: apps/v1
kind: Deployment
metadata:
  name: moment-backend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: moment-backend
  template:
    metadata:
      labels:
        app: moment-backend
    spec:
      containers:
        - name: moment-backend
          image: moment-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: moment-config
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: moment-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: moment-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: moment-secret
                  key: JWT_SECRET
            - name: KAKAO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: moment-secret
                  key: KAKAO_CLIENT_ID
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: moment-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: moment-config
                  key: REDIS_PORT
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5