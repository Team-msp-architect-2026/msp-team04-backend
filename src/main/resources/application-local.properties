spring.application.name=moment-backend

# PostgreSQL Local
spring.datasource.url=${LOCAL_DB_URL:jdbc:postgresql://localhost:5432/moment_local}
spring.datasource.username=${LOCAL_DB_USERNAME:moment}
# Local development/test default value.
# If LOCAL_DB_PASSWORD exists, it takes priority.
# Otherwise, use compose.yaml default POSTGRES_PASSWORD.
spring.datasource.password=${LOCAL_DB_PASSWORD:moment1234}

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Redis Local
spring.data.redis.host=${LOCAL_REDIS_HOST:localhost}
spring.data.redis.port=${LOCAL_REDIS_PORT:6379}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Server
server.port=${LOCAL_SERVER_PORT:8080}

# Local development/test Base64 dummy JWT Secret.
# Production must inject a real secret through environment variables or secret manager.
jwt.secret-key=${LOCAL_JWT_SECRET:bW9tZW50LWxvY2FsLXRlc3Qtc2VjcmV0LWtleS0xMjM0NTY=}


kakao.client-id=f4c7c025c81b57486c08a43afd423e5d
kakao.redirect-uri=https://destiny-why-aloe.ngrok-free.dev/auth/kakao

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always


# Toss Payments Local/Test
# Client key is returned to frontend for test payment window.
# Secret key must only be used by backend and must never be committed.
toss.client-key=${TOSS_CLIENT_KEY:}
toss.secret-key=${TOSS_SECRET_KEY:}
toss.api-base-url=${TOSS_API_BASE_URL:https://api.tosspayments.com}
toss.success-url=${TOSS_SUCCESS_URL:http://localhost:8080/api/payments/toss/success}
toss.fail-url=${TOSS_FAIL_URL:http://localhost:8080/api/payments/toss/fail}

opensearch.host=${OPENSEARCH_HOST:localhost}
opensearch.port=${OPENSEARCH_PORT:9200}

# moment-ai Local
# Spring Boot Backend calls this internal AI service.
ai.service-base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
