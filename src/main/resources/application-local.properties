spring.application.name=moment-backend

# PostgreSQL Local
spring.datasource.url=${LOCAL_DB_URL:jdbc:postgresql://localhost:5432/moment_local}
spring.datasource.username=${LOCAL_DB_USERNAME:moment}
spring.datasource.password=${LOCAL_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Redis Local
spring.data.redis.host=${LOCAL_REDIS_HOST:localhost}
spring.data.redis.port=${LOCAL_REDIS_PORT:6379}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Server
server.port=${LOCAL_SERVER_PORT:8080}

# Local JWT
jwt.secret-key=${LOCAL_JWT_SECRET}

