# CI 전용 profile

# DB - 연결 안 함 (Context 로딩 테스트 제외)
spring.datasource.url=jdbc:postgresql://localhost:5432/ci_dummy
spring.datasource.username=ci
spring.datasource.password=ci
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway - CI에서는 비활성화
spring.flyway.enabled=false

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT dummy
jwt.secret-key=Y2ktZHVtbXktand0LXNlY3JldC1rZXktZm9yLXRlc3Qtb25seQ==

# Batch
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never

# OpenSearch dummy
opensearch.host=localhost
opensearch.port=9200

# AI service dummy
ai.service-base-url=http://localhost:8000

# AWS dummy
spring.cloud.aws.region.static=ap-northeast-3
spring.cloud.aws.credentials.access-key=ci-dummy
spring.cloud.aws.credentials.secret-key=ci-dummy
aws.region=ap-northeast-3
aws.credentials.access-key=ci-dummy
aws.credentials.secret-key=ci-dummy
aws.credentials.session-token=ci-dummy

# SQS dummy
sqs.queue.url=https://sqs.ap-northeast-3.amazonaws.com/000000000000/ci-dummy

# S3 dummy
