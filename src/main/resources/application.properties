spring.application.name=moment-backend
server.port=8080

# ?? profile
spring.profiles.default=local

# JPA ?? ??
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway ?? ??
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=your-base64-encoded-secret-key-here
jwt.access-token-expiry=3600000

# Swagger (dev/local? ??)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.docker.compose.enabled=false

# Logging - MDC requestId ??
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{requestId}] [%thread] %-5level %logger{36} - %msg%n
logging.level.com.moment.momentbackend=DEBUG

# Profile image upload
upload.s3.profile.bucket-name=${PROFILE_IMAGE_BUCKET_NAME:}
upload.s3.profile.public-url-base=${PROFILE_IMAGE_PUBLIC_URL_BASE:}
upload.s3.profile.presigned-url-expiration-seconds=${PROFILE_IMAGE_PRESIGNED_URL_EXPIRATION_SECONDS:600}
upload.s3.profile.max-file-size-bytes=${PROFILE_IMAGE_MAX_FILE_SIZE_BYTES:5242880}
upload.s3.profile.key-prefix=${PROFILE_IMAGE_KEY_PREFIX:uploads/profile}

# AWS common
aws.region=${AWS_REGION:ap-northeast-3}
aws.credentials.access-key=${AWS_ACCESS_KEY_ID:}
aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:}
aws.credentials.session-token=${AWS_SESSION_TOKEN:}

# Notification
notification.sns.enabled=${NOTIFICATION_SNS_ENABLED:false}
notification.sns.topic-arn=${NOTIFICATION_SNS_TOPIC_ARN:}
notification.scheduler.enabled=${NOTIFICATION_SCHEDULER_ENABLED:false}
notification.scheduler.deadline-soon-cron=${NOTIFICATION_DEADLINE_SOON_CRON:0 0 9 * * *}
notification.scheduler.recruiting-open-cron=${NOTIFICATION_RECRUITING_OPEN_CRON:0 10 9 * * *}

# SQS public data consumer is disabled by default.
# Enable only when this backend instance should consume public-data SQS messages.

# Spring Batch CSV fallback job is disabled by default.
# Enable only when intentionally running local/dev CSV sync.
spring.batch.job.enabled=${SPRING_BATCH_JOB_ENABLED:false}

batch.sqs.consumer.enabled=${BATCH_SQS_CONSUMER_ENABLED:false}
