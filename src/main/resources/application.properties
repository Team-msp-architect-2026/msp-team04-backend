spring.application.name=moment-backend
server.port=8080

# ?? profile
spring.profiles.default=local

# JPA ?? ??
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway ?? ??
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=your-base64-encoded-secret-key-here
jwt.access-token-expiry=3600000

# Swagger (dev/local? ??)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.docker.compose.enabled=false

# Logging - MDC requestId ??
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{requestId}] [%thread] %-5level %logger{36} - %msg%n
logging.level.com.moment.momentbackend=DEBUG