name: Backend CI – Docker Build & ECR Push

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPOSITORY_BACKEND: moment-dev-backend-api
  ECR_REPOSITORY_BATCH: moment-dev-batch-job

jobs:
  build-and-push:
    name: Backend & Batch – Docker Build & ECR Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build bootJar
        run: ./gradlew clean bootJar -x test --no-daemon

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: tag
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & Push Backend API Docker image
        uses: docker/build-push-action@v5
        id: push-backend
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_BACKEND }}:dev-${{ steps.tag.outputs.SHORT_SHA }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            service=backend-api

      - name: Build & Push Batch Job Docker image
        uses: docker/build-push-action@v5
        id: push-batch
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_BATCH }}:dev-${{ steps.tag.outputs.SHORT_SHA }}
          cache-from: type=gha,scope=batch
          cache-to: type=gha,mode=max,scope=batch
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            service=batch-job

      - name: Print image summary
        run: |
          echo "## Docker Build & ECR Push 결과" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Image URI | Digest |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| backend-api | ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_BACKEND }}:dev-${{ steps.tag.outputs.SHORT_SHA }} | ${{ steps.push-backend.outputs.digest }} |" >> $GITHUB_STEP_SUMMARY
          echo "| batch-job | ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_BATCH }}:dev-${{ steps.tag.outputs.SHORT_SHA }} | ${{ steps.push-batch.outputs.digest }} |" >> $GITHUB_STEP_SUMMARY

      - name: Save image info as artifact
        run: |
          mkdir -p /tmp/image-info
          echo "BACKEND_IMAGE_URI=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_BACKEND }}:dev-${{ steps.tag.outputs.SHORT_SHA }}" >> /tmp/image-info/image-info.env
          echo "BATCH_JOB_IMAGE_URI=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_BATCH }}:dev-${{ steps.tag.outputs.SHORT_SHA }}" >> /tmp/image-info/image-info.env
          echo "IMAGE_TAG=dev-${{ steps.tag.outputs.SHORT_SHA }}" >> /tmp/image-info/image-info.env
          echo "BACKEND_DIGEST=${{ steps.push-backend.outputs.digest }}" >> /tmp/image-info/image-info.env
          echo "BATCH_DIGEST=${{ steps.push-batch.outputs.digest }}" >> /tmp/image-info/image-info.env

      - name: Upload image info artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-info
          path: /tmp/image-info/image-info.env
          retention-days: 7

      - name: Trigger Helm values update
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITOPS_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'Team-msp-architect-2026',
              repo: 'msp-team04-infra',
              workflow_id: 'update-helm-values.yml',
              ref: 'develop',
              inputs: {
                service: 'backend-batch',
                image_tag: 'dev-${{ steps.tag.outputs.SHORT_SHA }}',
                environment: 'dev',
                dry_run: 'false'
              }
            });
            console.log('Triggered Helm values update for dev-${{ steps.tag.outputs.SHORT_SHA }}');